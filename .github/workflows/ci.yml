name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # The application is scaffolded in EPIC 1. Until package.json exists, the
  # downstream jobs have nothing to run and are skipped rather than failed.
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.check.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f package.json ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json not present yet — skipping build and test jobs."
          fi

  lint:
    name: lint
    needs: preflight
    if: needs.preflight.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Formatting is part of the lint gate rather than a sixth job: it shares
      # the same install and runs in under a second.
      - run: pnpm format:check

  typecheck:
    name: typecheck
    needs: preflight
    if: needs.preflight.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: unit
    needs: preflight
    if: needs.preflight.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --run --coverage

  build:
    name: build
    needs: preflight
    if: needs.preflight.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Guards the invariant that no WASM binary ships in the initial bundle.
      - name: Assert no WASM in the initial bundle
        run: |
          if find .next/static/chunks -maxdepth 1 -name '*.wasm' | grep -q .; then
            echo "::error::A .wasm binary was found in the initial chunk directory. Engines must load via dynamic import()."
            exit 1
          fi

  e2e:
    name: e2e
    needs: preflight
    if: needs.preflight.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
