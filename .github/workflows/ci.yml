name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # The application is scaffolded in EPIC 1. Until package.json exists, the
  # downstream jobs have nothing to run and are skipped rather than failed.
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.check.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f package.json ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json not present yet — skipping build and test jobs."
          fi

  lint:
    name: lint
    needs: preflight
    if: needs.preflight.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Formatting is part of the lint gate rather than a sixth job: it shares
      # the same install and runs in under a second.
      - run: pnpm format:check

  typecheck:
    name: typecheck
    needs: preflight
    if: needs.preflight.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: unit
    needs: preflight
    if: needs.preflight.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --run --coverage

  build:
    name: build
    needs: preflight
    if: needs.preflight.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Guards the invariant that no WASM binary ships in the initial bundle.
      # The source half of it — that nothing in the repository imports an engine
      # eagerly — is asserted in the unit job by test/app/initial-bundle.test.ts.
      # This half follows every route's first-load set through the manifests,
      # rather than looking in one directory for a binary that is vendored into
      # public/ and would never have been emitted there.
      - name: Assert no WASM in the initial bundle
        run: pnpm check:wasm
      # The budget reads the manifest `pnpm build` just wrote, so it belongs in
      # this job rather than a sixth one that would have to rebuild to measure.
      - name: Check the bundle budget
        run: pnpm size
      # The pre-launch SEO audit reads the 128 HTML files the build produced,
      # which is the only check here that sees what a crawler sees. Same job for
      # the same reason: it needs the build, and nothing else does.
      - name: Run the SEO audit
        run: pnpm audit:seo

  # The Lighthouse gate only runs when something that can change a score
  # changed. It costs three production builds' worth of auditing, and a pull
  # request that touches a router test or a memory model cannot move a number in
  # it. `ui_changed` is computed once, here, so the job below has a single
  # condition rather than a `paths` filter that would gate the whole workflow.
  ui-changes:
    name: ui-changes
    needs: preflight
    if: needs.preflight.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    outputs:
      ui_changed: ${{ steps.check.outputs.ui_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base has to be in the clone for the diff below to have
          # something to compare against.
          fetch-depth: 0
      - id: check
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          if [ -z "$BASE" ]; then
            # A push to main: audit it, since nothing else will.
            echo "ui_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "Changed files:"; echo "$CHANGED"

          if echo "$CHANGED" | grep -qE '^(app/|components/|public/|next\.config\.ts|lighthouserc\.cjs|package\.json)'; then
            echo "ui_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui_changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No UI file changed — skipping the Lighthouse audit."
          fi

  lighthouse:
    name: lighthouse
    needs: [preflight, ui-changes]
    if: needs.preflight.outputs.has_app == 'true' && needs.ui-changes.outputs.ui_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # `lhci autorun` starts the server itself, audits each URL three times and
      # asserts against lighthouserc.cjs. It exits non-zero on an `error`
      # assertion and zero on a `warn`, which is the distinction that file makes
      # deliberately — see the comment above `categories:performance`.
      - run: pnpm exec lhci autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7

  e2e:
    name: e2e
    needs: preflight
    if: needs.preflight.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
