# Docify label taxonomy.
# Apply with: gh label create <name> --color <hex> --description "<desc>" --force

- name: "type:epic"
  color: "0D1117"
  description: "A large body of work tracked via sub-issues"
- name: "type:feat"
  color: "1F2328"
  description: "New functionality"
- name: "type:fix"
  color: "A83A2E"
  description: "Bug fix"
- name: "type:refactor"
  color: "57606A"
  description: "Structural change with no behaviour change"
- name: "type:perf"
  color: "B4762A"
  description: "Performance work"
- name: "type:docs"
  color: "6B6A66"
  description: "Documentation"
- name: "type:test"
  color: "3F7D4E"
  description: "Tests only"
- name: "type:chore"
  color: "8C8C88"
  description: "Tooling, dependencies, CI"

- name: "area:router"
  color: "5B3A29"
  description: "lib/router — capability router"
- name: "area:engine"
  color: "7A4B2A"
  description: "lib/engines — conversion engines"
- name: "area:ui"
  color: "9A6B3F"
  description: "Converter UI and components"
- name: "area:design"
  color: "B08968"
  description: "Design system, tokens, layout"
- name: "area:seo"
  color: "4A6E4F"
  description: "Programmatic SEO, metadata, schema"
- name: "area:perf"
  color: "6E8B5A"
  description: "Core Web Vitals, bundle size"
- name: "area:a11y"
  color: "5A7D7C"
  description: "Accessibility"
- name: "area:backend"
  color: "4E5D6C"
  description: "Neon stats, URL proxy"
- name: "area:ci"
  color: "3D4450"
  description: "CI/CD, workflows"
- name: "area:agent"
  color: "6B5B7B"
  description: "Agent memory system, skills, CLAUDE.md"

- name: "priority:p0"
  color: "8B0000"
  description: "Blocking — do first"
- name: "priority:p1"
  color: "C1440E"
  description: "Important"
- name: "priority:p2"
  color: "D9A441"
  description: "Nice to have"

- name: "status:blocked"
  color: "6E0000"
  description: "Waiting on something else"
- name: "status:needs-review"
  color: "B4762A"
  description: "Awaiting review"
- name: "status:ready"
  color: "3F7D4E"
  description: "Ready to pick up"

- name: "size:xs"
  color: "E8E8E4"
  description: "Under 1 hour"
- name: "size:s"
  color: "CFCFC9"
  description: "1-3 hours"
- name: "size:m"
  color: "A8A8A2"
  description: "Half a day"
- name: "size:l"
  color: "7D7D77"
  description: "A day or more"
